[project]
name = "seo-inspector"
version = "0.1.0"
description = "SEO Inspector: one unified agent that audits a website against a fixed set of SEO factors."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "httpx>=0.27",
    "certifi",
    "selectolax>=0.3.21",
    "extruct>=0.17",
    "lxml>=5.0",
    "protego>=0.3",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "playwright>=1.45",
]

[project.optional-dependencies]
replit = ["replit-object-storage>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pillow>=10"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end test that needs Postgres and Chromium",
    "db: test that needs Postgres",
]
